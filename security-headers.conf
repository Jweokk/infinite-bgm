# 公共安全响应头 —— 在每个 location 内 include（nginx 的 add_header 不会跨层级继承，
# 一旦某 location 自己写了 add_header，上层定义就全部失效，所以必须逐层 include）。

# 纯静态、零外部依赖：可以用严格 CSP。
# - style-src 需要 'unsafe-inline'：应用运行时会注入 <style> 并写行内 CSS 变量。
# - media-src 允许 data:：iOS 音频解锁用的静音 <audio> data URI（见 CHANGELOG v1.0.2）。
# - cloudflareinsights 是 Cloudflare 边缘对本 zone 的 HTML 响应自动注入的 Web Analytics
#   脚本（非本应用引入；curl 无 Accept:text/html 时不注入）。若不想要它，在 CF 面板
#   关闭该 zone 的 Web Analytics，再把这两处白名单删掉即可，CSP 会更严。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
