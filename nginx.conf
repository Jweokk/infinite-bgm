user  nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/security-headers.conf;

        # 带 hash 的构建产物：永久缓存
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        # 入口文档：不缓存，发版即生效
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # 访问计数后端（容器 bgm-counter，走 Docker 内置 DNS）。
        # 用变量 + resolver 而不是写死 upstream：即使计数器还没起来，nginx 也能正常启动。
        location /api/ {
            include /etc/nginx/security-headers.conf;
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $counter_api http://counter:8080;
            proxy_pass $counter_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 10s;
        }

        # 统计报表（需要 ?token=）
        location = /stats {
            include /etc/nginx/security-headers.conf;
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $counter_stats http://counter:8080;
            proxy_pass $counter_stats;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 15s;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            include /etc/nginx/security-headers.conf;
            try_files $uri $uri/ /index.html;
        }
    }
}
